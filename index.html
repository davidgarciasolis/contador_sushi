<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fff5e8" />
    <title>Maki Flip</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100svh;
        overflow: hidden;
        font-family: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", system-ui, sans-serif;
        color: #201917;
        background:
          radial-gradient(circle at 10% 12%, #ffd9b7 0 4px, transparent 5px),
          radial-gradient(circle at 89% 22%, #ffd9b7 0 5px, transparent 6px),
          radial-gradient(circle at 16% 78%, #ffd9b7 0 3px, transparent 4px),
          #fff5e8;
      }
      main {
        width: min(100%, 460px);
        min-height: 100svh;
        margin: auto;
        padding: max(22px, env(safe-area-inset-top)) 24px max(26px, env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      header { text-align: center; }
      h1 { margin: 0; font-size: clamp(2rem, 9vw, 3rem); letter-spacing: -0.08em; }
      header p { margin: 8px 0 0; color: #786b63; font-weight: 650; font-size: .98rem; }
      .counter-card {
        margin-top: 22px;
        width: min(100%, 265px);
        background: #fffdf9;
        border: 2px solid #201917;
        border-radius: 24px;
        box-shadow: 5px 6px 0 #201917;
        text-align: center;
        padding: 15px 20px 13px;
      }
      .counter-label { display:block; color:#887970; font-size:.72rem; font-weight:800; letter-spacing:.14em; text-transform:uppercase; }
      #count {
        width: 100%; border: 0; outline: 0; padding: 2px 0 0; background: transparent;
        color: #ed5d48; font: 900 clamp(3.3rem, 16vw, 5.1rem)/1 ui-rounded, system-ui, sans-serif;
        text-align: center; letter-spacing: -.1em;
      }
      #count:focus { color: #c94736; }
      .editable { margin: 0; color:#8c7b71; font-size:.75rem; font-weight:700; }
      .stage { flex: 1; display: grid; place-items: center; width:100%; min-height: 290px; }
      .tap-area {
        position: relative; width: 238px; height: 238px; border: 0; padding: 0; cursor: pointer;
        background: transparent; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
        perspective: 650px;
      }
      .tap-area::before {
        content: ""; position: absolute; inset: 17px; border-radius: 50%; background:#ffe1ca;
        box-shadow: inset 0 0 0 2px #f4c29d;
      }
      .maki {
        position:absolute; width:286px; height:286px; left:-24px; top:-24px;
        object-fit:contain; pointer-events:none; will-change:transform;
        filter:drop-shadow(0 12px 8px #9c746844);
      }
      .tap-area.flipping::before { animation: pulse .72s ease-out both; }
      @keyframes pulse { 0% { transform:scale(.82); opacity:.1; } 45% { transform:scale(1.16); opacity:1; } 100% { transform:scale(1); opacity:1; } }
      .hint { margin: -4px 0 0; font-size: .98rem; font-weight:800; color:#5b4c44; }
      .hint b { color:#ed5d48; }
      footer { color:#9a8980; font-size:.78rem; font-weight:650; }
      @media (prefers-reduced-motion: reduce) { .tap-area.flipping .maki, .tap-area.flipping::before { animation-duration: .01ms; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Contador de Sushi</h1>
        <p>Un salto, un sushi más.</p>
      </header>
      <section class="counter-card" aria-label="Contador de sushi">
        <label class="counter-label" for="count">Sushis contados</label>
        <input id="count" type="number" inputmode="numeric" value="0" min="0" aria-label="Editar contador" />
        <p class="editable">Toca el número para ajustarlo manualmente</p>
      </section>
      <section class="stage">
        <button class="tap-area" id="flipButton" type="button" aria-label="Hacer que el sushi dé un backflip">
          <img class="maki" id="makiSprite" src="assets/backflip-frames/frame-01.png" alt="Maki de salmón sonriente" />
        </button>
      </section>
      <p class="hint">Cada toque suma <b>1 sushi</b> y hace un backflip</p>
      <footer>Tu cuenta se reinicia al recargar ✦</footer>
    </main>
    <script>
      const count = document.querySelector('#count');
      const button = document.querySelector('#flipButton');
      const sprite = document.querySelector('#makiSprite');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const frames = Array.from({ length: 8 }, (_, index) =>
        `assets/backflip-frames/frame-${String(index + 1).padStart(2, '0')}.png`
      );
      frames.slice(1).forEach(source => { const image = new Image(); image.src = source; });
      count.value = 0;
      let animationFrame;
      function playBackflip(startTime) {
        const duration = 760;
        let currentFrame = -1;
        function step(now) {
          const progress = Math.min((now - startTime) / duration, 1);
          const frame = Math.min(Math.floor(progress * frames.length), frames.length - 1);
          const lift = Math.sin(progress * Math.PI) * 72;
          const scale = 1 - Math.sin(progress * Math.PI) * .08;
          if (frame !== currentFrame) { sprite.src = frames[frame]; currentFrame = frame; }
          sprite.style.transform = `translateY(${-lift}px) scale(${scale})`;
          if (progress < 1) {
            animationFrame = requestAnimationFrame(step);
          } else {
            sprite.src = frames[0];
            sprite.style.transform = '';
            button.classList.remove('flipping');
          }
        }
        animationFrame = requestAnimationFrame(step);
      }
      button.addEventListener('click', () => {
        const current = Number.parseInt(count.value, 10);
        count.value = Number.isFinite(current) ? current + 1 : 1;
        cancelAnimationFrame(animationFrame);
        button.classList.remove('flipping');
        void button.offsetWidth;
        button.classList.add('flipping');
        if (reducedMotion) {
          sprite.src = frames[7];
          setTimeout(() => { sprite.src = frames[0]; button.classList.remove('flipping'); }, 100);
        } else {
          playBackflip(performance.now());
        }
      });
      count.addEventListener('change', () => {
        const value = Number.parseInt(count.value, 10);
        count.value = Number.isFinite(value) && value >= 0 ? value : 0;
      });
    </script>
  </body>
</html>
